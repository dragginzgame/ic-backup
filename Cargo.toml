[workspace]
resolver = "3"
members = ["crates/ic-backup"]
exclude = ["qualification"]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-backup"
publish = ["crates-io"]

[workspace.dependencies]
# Production
ic-host-artifacts = "0.80.2"
ic-host-fs = "0.80.2"
ic-host-http = "0.80.0"
ic-platform-types = { version = "0.21.2", default-features = false, features = ["principal-self-authenticating"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# PocketIC 16.1 requires 2.0.18 in the independent qualification graph.
# Product Cargo.lock continues to select 2.0.21.
thiserror = "2.0.18"

# Production and tests
ic-platform = { version = "0.34.11", default-features = false, features = ["ingress-packets", "ed25519", "ecdsa", "certificate-authentication", "certificate-construction"] }
ic-platform-protocol = { version = "0.3.3", default-features = false, features = ["management-snapshots"] }
tokio = { version = "1.53.3", default-features = false, features = ["time"] }

# Tests and tooling
toko-tooling = "=0.45.21"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
empty_line_after_doc_comments = "allow"
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
