[workspace]
members = ["crates/ic-backup"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-backup"
publish = false

[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
dead_code = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
