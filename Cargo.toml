[workspace]
members = ["crates/ic-backup", "crates/ic-backup-agent"]
resolver = "3"

[workspace.package]
version = "0.41.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-backup"
publish = ["crates-io"]

[workspace.dependencies]
# Production dependencies
ic-backup = { version = "0.41.0", path = "crates/ic-backup" }
ic-host-artifacts = { version = "0.67.0", default-features = false }
ic-host-fs = { version = "0.67.0", default-features = false }
ic-host-process = { version = "0.67.0", default-features = false }
ic-platform = { version = "0.6", default-features = false, features = ["candid", "management-canister-types"] }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }

# Tests and tooling only
ic-testkit = "0.67.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
dead_code = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
