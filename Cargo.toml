[workspace]
resolver = "3"
members = ["crates/ic-backup"]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-backup"
publish = false

[workspace.dependencies]
ic-host-artifacts = "0.77.2"
ic-host-fs = { version = "0.77.2", features = ["capability"] }
ic-platform = { version = "0.33.0", default-features = false, features = ["management-canister-types"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toko-tooling = "=0.43.0"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
