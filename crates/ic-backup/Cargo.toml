[package]
name = "ic-backup"
version = "0.102.1"
description = "Host-side capture, restore and local backup inventory for Internet Computer canisters"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(unix)'.dependencies]
ic-host-artifacts.workspace = true
ic-host-fs.workspace = true
ic-host-http.workspace = true
ic-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[target.'cfg(unix)'.dev-dependencies]
tokio = { workspace = true, features = ["rt", "net"] }

[lints]
workspace = true
