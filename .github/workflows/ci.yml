name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit snapshot before preparation
        run: bash vendor/toko-tooling/scripts/ci/verify-toko-tooling-snapshot.sh --consumer . --require-annotations
      - name: Restore pinned tool downloads
        uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
      - name: Prepare admission prerequisites
        run: perl scripts/ci/setup.pl host-tools make install-host-tools
      - name: Prepare selected Rust toolchain
        shell: bash
        run: |
          export PATH="$PWD/.tools/host/bin:$PATH"
          perl scripts/ci/setup.pl rust-toolchain \
            bash vendor/toko-tooling/scripts/dev/prepare-rust-toolchain.sh \
            --toolchain-file rust-toolchain.toml
      - name: Admit Cargo selection and documentation
        run: make toko-tooling-check doc-links-check
      - name: Prepare shared Rust developer tools
        run: perl scripts/ci/setup.pl rust-tools make install-rust-tools
      - name: Check formatting
        run: make fmt-check
      - name: Prepare publication fixture dependencies
        run: perl scripts/ci/setup.pl dependencies make fetch-dependencies
      - name: Qualify publication caller wiring
        env:
          CARGO_NET_OFFLINE: "true"
        run: make test-publication-adapter
      - name: Prepare the pinned secret scanner
        shell: bash
        run: |
          perl scripts/ci/setup.pl secret-scanner bash -euo pipefail -c '
          gitleaks_bin="$(bash vendor/toko-tooling/scripts/ci/install-ci-tool.sh gitleaks \
            --install-dir "$RUNNER_TEMP/ic-backup-security-bin")"
          printf "GITLEAKS_BIN=%s\n" "$gitleaks_bin" >> "$GITHUB_ENV"
          '
      - name: Save pinned tool downloads
        uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Scan repository history for secrets
        run: '"$GITLEAKS_BIN" git --redact=100 --no-banner --no-color --log-level error'

      - name: Retain sanitized setup diagnostics
        if: failure()
        id: setup-evidence
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: setup-scaffold
          path: target/ci-setup/.attempt-*/diagnostic.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Report setup evidence location
        if: failure()
        env:
          EVIDENCE_URL: ${{ steps.setup-evidence.outputs.artifact-url }}
          UPLOAD_OUTCOME: ${{ steps.setup-evidence.outcome }}
        run: |
          if [[ "$UPLOAD_OUTCOME" == success && -n "$EVIDENCE_URL" ]]; then
            printf 'Sanitized setup diagnostics: %s\n' "$EVIDENCE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Setup diagnostic upload failed or selected evidence is missing.' >> "$GITHUB_STEP_SUMMARY"
          fi

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Admit snapshot before preparation
        run: bash vendor/toko-tooling/scripts/ci/verify-toko-tooling-snapshot.sh --consumer . --require-annotations
      - name: Prepare admission prerequisites
        run: perl scripts/ci/setup.pl host-tools make install-host-tools
      - name: Prepare selected Rust toolchain
        shell: bash
        run: |
          export PATH="$PWD/.tools/host/bin:$PATH"
          perl scripts/ci/setup.pl rust-toolchain \
            bash vendor/toko-tooling/scripts/dev/prepare-rust-toolchain.sh \
            --toolchain-file rust-toolchain.toml
      - name: Admit Cargo selection
        run: make toko-tooling-check
      - name: Prepare locked dependencies
        run: perl scripts/ci/setup.pl dependencies make fetch-dependencies
      - name: Qualify native scaffold offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: make clippy rustdoc test
      - name: Lint qualification callers offline
        run: cargo clippy --manifest-path qualification/Cargo.toml --locked --offline --all-targets -- -D warnings
      - name: Prepare locked Testkit server
        env:
          CARGO_NET_OFFLINE: "true"
        if: matrix.os == 'ubuntu-24.04'
        run: perl scripts/ci/setup.pl testkit-server make install-testkit-server
      - name: Admit installed Testkit server offline
        env:
          CARGO_NET_OFFLINE: "true"
        if: matrix.os == 'ubuntu-24.04'
        run: make testkit-server-check
      - name: Qualify actual-IC capture and recovery offline
        if: matrix.os == 'ubuntu-24.04'
        env:
          CARGO_NET_OFFLINE: "true"
          IC_BACKUP_TESTKIT_DIRECTORY: ${{ github.workspace }}/.tools/testkit-server
        run: cargo test --release --manifest-path qualification/Cargo.toml --locked -p ic-backup-qualification --test capture
      - name: Retain sanitized setup diagnostics
        if: failure()
        id: setup-evidence
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: setup-${{ matrix.os }}
          path: target/ci-setup/.attempt-*/diagnostic.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Report setup evidence location
        if: failure()
        env:
          EVIDENCE_URL: ${{ steps.setup-evidence.outputs.artifact-url }}
          UPLOAD_OUTCOME: ${{ steps.setup-evidence.outcome }}
        run: |
          if [[ "$UPLOAD_OUTCOME" == success && -n "$EVIDENCE_URL" ]]; then
            printf 'Sanitized setup diagnostics: %s\n' "$EVIDENCE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Setup diagnostic upload failed or selected evidence is missing.' >> "$GITHUB_STEP_SUMMARY"
          fi
