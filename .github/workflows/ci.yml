name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Retain temporary validation fixtures
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/ci-fixtures"
          echo "TMPDIR=$GITHUB_WORKSPACE/target/ci-fixtures" >> "$GITHUB_ENV"
          echo "SHARED_TOOLING_STORE=$RUNNER_TEMP/ic-backup-tool-store" >> "$GITHUB_ENV"
      - name: Install the pinned development toolchain
        run: rustup show active-toolchain
      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install the reviewed Linux ShellCheck
        if: runner.os == 'Linux'
        run: |
          source ci/tool-versions.env
          bash scripts/ci/install-shellcheck.sh \
            --version "$SHARED_TOOLING_SHELLCHECK_VERSION" \
            --sha256 "$SHARED_TOOLING_SHELLCHECK_SHA256_LINUX_X86_64" \
            --install-dir "$GITHUB_WORKSPACE/.tools/ci/bin"
          echo "$GITHUB_WORKSPACE/.tools/ci/bin" >> "$GITHUB_PATH"
      - name: Install macOS shell tooling
        if: runner.os == 'macOS'
        run: |
          brew install flock make shellcheck
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Prepare reviewed common tools and the locked Testkit simulator
        run: |
          make install-tools
          printf '%s\n' "$GITHUB_WORKSPACE/.tools/host/bin" \
            "$GITHUB_WORKSPACE/.tools/ic/bin" "$GITHUB_WORKSPACE/.tools/rust/common/bin" >> "$GITHUB_PATH"
          make tools-check
      - name: Verify native shared-tool reuse without downloads
        run: |
          sharing="$GITHUB_WORKSPACE/target/ci-fixtures/shared-tools"
          mkdir -p "$sharing/consumer" "$sharing/bin"
          printf '#!/bin/sh\necho unexpected-download >&2\nexit 91\n' > "$sharing/bin/curl"
          chmod +x "$sharing/bin/curl"
          for kind in host ic; do
            pins=(--versions "$GITHUB_WORKSPACE/ci/tool-versions.env")
            if [[ "$kind" == ic ]]; then pins=(--pins "$GITHUB_WORKSPACE/ci/ic-tools.tsv"); fi
            for mode in install check; do
              options=()
              if [[ "$mode" == check ]]; then options=(--check); fi
              PATH="$sharing/bin:$PATH" bash "scripts/dev/install-$kind-tools.sh" \
                --consumer "$sharing/consumer" "${pins[@]}" ${options[@]+"${options[@]}"} \
                > "$sharing/$kind-$mode.log" 2>&1
            done
            test "$(cd "$GITHUB_WORKSPACE/.tools/$kind" && pwd -P)" = "$(cd "$sharing/consumer/.tools/$kind" && pwd -P)"
          done
      - name: Check tooling with macOS system Bash 3.2
        if: runner.os == 'macOS'
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          /bin/bash scripts/ci/test-tooling.sh
          /bin/bash scripts/ci/test-maintenance-task.sh
          perl scripts/ci/test-documentation-links.pl
          perl scripts/ci/test-local-lock-versions.pl
          /bin/bash scripts/ci/test-file-digests.sh
          /bin/bash scripts/ci/test-dependency-pins.sh
          /bin/bash scripts/ci/test-cargo-metadata.sh
          /bin/bash scripts/ci/test-format-tools.sh
          /bin/bash scripts/ci/test-evidence-checksums.sh
          /bin/bash scripts/ci/test-evidence-archive.sh
          /bin/bash scripts/ci/test-host-tools.sh
          /bin/bash scripts/ci/test-tool-commands.sh
          /bin/bash scripts/ci/test-testkit-commands.sh
          /bin/bash scripts/ci/test-cloc.sh
          /bin/bash scripts/ci/test-rust-tools.sh
          /bin/bash scripts/ci/test-ic-tools.sh
          /bin/bash scripts/release/test-release.sh
          RELEASE_MAKE=make /bin/bash scripts/ci/test-release-runner.sh
          /bin/bash scripts/hooks/test-hooks.sh
      - name: Validate the native library and repository tooling
        run: make ci
      - name: Archive failed validation evidence
        id: validation-archive
        if: failure()
        run: |
          inputs=()
          for path in target/ci-fixtures target/validation-failures target/*-tests.*; do
            if [[ -e "$path" || -L "$path" ]]; then
              inputs+=("$GITHUB_WORKSPACE" "$path")
            fi
          done
          for root in "$RUNNER_TEMP" "$TMPDIR"; do
            for path in "$root"/formatting.*; do
              if [[ -e "$path" || -L "$path" ]]; then
                inputs+=("$root" "${path#"$root/"}")
              fi
            done
          done
          # Preserve common/selected slots, receipts and failed Cargo attempts.
          # The archive retains links without following them.
          if [[ ! -L .tools && ! -L .tools/rust && -d .tools/rust ]]; then
            inputs+=("$GITHUB_WORKSPACE" .tools/rust)
          fi
          # Select only this checkout's retained references and admitted bundles.
          archive_root="$(mktemp -d "$RUNNER_TEMP/ic-backup-evidence.XXXXXX")"
          # Publish the retention destination before either collection can fail.
          printf 'path=%s\n' "$archive_root" >> "$GITHUB_OUTPUT"
          if [[ ${#inputs[@]} != 0 ]]; then
            if bash scripts/ci/archive-evidence.sh "$archive_root/local-evidence.tar.gz" "${inputs[@]}" \
                > "$archive_root/local-archive.log" 2>&1; then
              :
            else
              status=$?
              printf 'Local evidence collection incomplete (exit %s); retaining diagnostics.\n' "$status" >&2
              exit "$status"
            fi
          fi
          if bash scripts/ci/select-tool-evidence.sh full "$GITHUB_WORKSPACE" "$archive_root" \
              > "$archive_root/selections.nul" 2> "$archive_root/shared-selection.log"; then
            :
          else
            status=$?
            printf 'Shared evidence selection incomplete (exit %s); retaining local evidence and diagnostics.\n' "$status" >&2
            exit "$status"
          fi
          shared_inputs=()
          while IFS= read -r -d '' selected_root && IFS= read -r -d '' selected_path; do
            shared_inputs+=("$selected_root" "$selected_path")
          done < "$archive_root/selections.nul"
          if [[ ${#shared_inputs[@]} != 0 ]]; then
            if bash scripts/ci/archive-evidence.sh "$archive_root/shared-tools.tar.gz" "${shared_inputs[@]}" \
                > "$archive_root/shared-archive.log" 2>&1; then
              :
            else
              status=$?
              printf 'Shared evidence collection incomplete (exit %s); retaining local evidence and diagnostics.\n' "$status" >&2
              exit "$status"
            fi
          fi
      - name: Retain failed validation evidence
        if: failure() && steps.validation-archive.outputs.path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.os }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ steps.validation-archive.outputs.path }}
