name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ startsWith(matrix.os, 'macos-') && 90 || 45 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Retain temporary validation fixtures
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/ci-fixtures"
          echo "TMPDIR=$GITHUB_WORKSPACE/target/ci-fixtures" >> "$GITHUB_ENV"
          echo "SHARED_TOOLING_STORE=$RUNNER_TEMP/ic-backup-tool-store" >> "$GITHUB_ENV"
      - name: Install the pinned development toolchain
        run: rustup show active-toolchain
      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Install the reviewed Linux ShellCheck
        if: runner.os == 'Linux'
        run: |
          source ci/tool-versions.env
          bash scripts/ci/install-ci-tool.sh shellcheck \
            --version "$SHARED_TOOLING_SHELLCHECK_VERSION" \
            --sha256 "$SHARED_TOOLING_SHELLCHECK_SHA256_LINUX_X86_64" \
            --install-dir "$GITHUB_WORKSPACE/.tools/ci/bin"
          echo "$GITHUB_WORKSPACE/.tools/ci/bin" >> "$GITHUB_PATH"
      - name: Install macOS shell tooling
        if: runner.os == 'macOS'
        run: |
          brew install flock make shellcheck
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Prepare reviewed common tools and the locked Testkit simulator
        run: |
          make install-tools
          printf '%s\n' "$GITHUB_WORKSPACE/.tools/host/bin" \
            "$GITHUB_WORKSPACE/.tools/rust/common/bin" >> "$GITHUB_PATH"
          make tools-check
      - name: Verify native shared-tool reuse offline
        run: |
          sharing="$GITHUB_WORKSPACE/target/ci-fixtures/shared-tools"
          mkdir -p "$sharing/consumer" "$sharing/bin"
          printf '#!/bin/sh\necho unexpected-download >&2\nexit 91\n' > "$sharing/bin/curl"
          chmod +x "$sharing/bin/curl"
          for mode in install check; do
            options=()
            if [[ "$mode" == check ]]; then options=(--check); fi
            PATH="$sharing/bin:$PATH" bash scripts/dev/install-host-tools.sh \
              --consumer "$sharing/consumer" ${options[@]+"${options[@]}"} \
              > "$sharing/host-$mode.log" 2>&1
          done
          test "$(cd "$GITHUB_WORKSPACE/.tools/host" && pwd -P)" = "$(cd "$sharing/consumer/.tools/host" && pwd -P)"
          # Cargo tool identities exclude application flags and wrappers.
          cp Cargo.lock "$sharing/consumer/Cargo.lock"
          for mode in install check; do
            options=()
            if [[ "$mode" == check ]]; then options=(--check); fi
            CARGO_NET_OFFLINE=true RUSTFLAGS=--invalid-application-flag RUSTC_WRAPPER=/absent-application-wrapper \
              bash scripts/dev/install-rust-tools.sh --consumer "$sharing/consumer" \
                ${options[@]+"${options[@]}"} \
                > "$sharing/rust-$mode.log" 2>&1
            CARGO_NET_OFFLINE=true RUSTFLAGS=--invalid-application-flag RUSTC_WRAPPER=/absent-application-wrapper \
              bash scripts/dev/install-rust-tools.sh --consumer "$sharing/consumer" \
                --package ic-testkit --lockfile "$sharing/consumer/Cargo.lock" \
                --bin ic-testkit-server --profile release ${options[@]+"${options[@]}"} \
                > "$sharing/testkit-$mode.log" 2>&1
          done
          for selected in "$GITHUB_WORKSPACE/.tools/rust/common/bin/"*; do
            tool="${selected##*/}"
            original="$(perl -MCwd=abs_path -e 'print abs_path($ARGV[0])' "$selected")"
            reused="$(perl -MCwd=abs_path -e 'print abs_path($ARGV[0])' "$sharing/consumer/.tools/rust/common/bin/$tool")"
            test -n "$original"
            test "$original" = "$reused"
          done
          testkit="$(tail -n 1 "$sharing/testkit-check.log")"
          test -x "$testkit"
          test "$(perl -MCwd=abs_path -e 'print abs_path($ARGV[0])' "$testkit")" = \
            "$(perl -MCwd=abs_path -e 'print abs_path($ARGV[0])' "$(bash scripts/dev/install-rust-tools.sh \
              --consumer "$GITHUB_WORKSPACE" --package ic-testkit --lockfile Cargo.lock \
              --bin ic-testkit-server --profile release --check)")"
      - name: Validate the native library and repository tooling
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            # Keep reviewed tool directories and Homebrew GNU Make on PATH,
            # while selecting the system Bash for every CI fixture and recipe.
            export PATH="/bin:$PATH"
            test "$(command -v bash)" = /bin/bash
            test "$(bash -c 'printf "%s.%s" "${BASH_VERSINFO[0]}" "${BASH_VERSINFO[1]}"')" = 3.2
          fi
          make ci
      - name: Archive failed validation evidence
        id: validation-archive
        if: failure()
        run: |
          archive_root="$(mktemp -d "$RUNNER_TEMP/ic-backup-evidence.XXXXXX")"
          printf 'path=%s\n' "$archive_root" >> "$GITHUB_OUTPUT"
          mkdir "$archive_root/diagnostics"
          inputs=()
          local_status=0
          if [[ -L target ]]; then
            inputs+=("$GITHUB_WORKSPACE" target)
            printf 'target is redirected; retaining the parent link only.\n' > "$archive_root/diagnostics/local-selection.log"
            local_status=1
          else
            for path in target/ci-fixtures target/validation-failures target/*-tests.*; do
              if [[ -e "$path" || -L "$path" ]]; then
                inputs+=("$GITHUB_WORKSPACE" "$path")
              fi
            done
          fi
          roots=("$RUNNER_TEMP")
          [[ "$TMPDIR" == "$RUNNER_TEMP" ]] || roots+=("$TMPDIR")
          for root in "${roots[@]}"; do
            if [[ -L target && "$root" == "$GITHUB_WORKSPACE/target/"* ]]; then continue; fi
            for path in "$root"/formatting.*; do
              if [[ -e "$path" || -L "$path" ]]; then
                inputs+=("$root" "${path#"$root/"}")
              fi
            done
          done
          if [[ -L .tools ]]; then
            inputs+=("$GITHUB_WORKSPACE" .tools)
            printf '.tools is redirected; retaining the parent link only.\n' >> "$archive_root/diagnostics/local-selection.log"
            local_status=1
          elif [[ -L .tools/rust ]]; then
            inputs+=("$GITHUB_WORKSPACE" .tools/rust)
            printf '.tools/rust is redirected; retaining the parent link only.\n' >> "$archive_root/diagnostics/local-selection.log"
            local_status=1
          fi
          printf '%s\n' "$local_status" > "$archive_root/diagnostics/local-selection-status"
          status=0
          bash scripts/ci/collect-tool-evidence.sh "$archive_root/evidence.tar.gz" \
            "$GITHUB_WORKSPACE" "$archive_root/diagnostics" full \
            "$GITHUB_WORKSPACE/ci/tool-versions.env" "$GITHUB_WORKSPACE/ci/ic-tools.tsv" \
            "${inputs[@]}" > "$archive_root/collection.log" 2>&1 || status=$?
          if [[ "$status" == 0 && "$local_status" != 0 ]]; then status=1; fi
          if [[ "$status" != 0 ]]; then
            cat "$archive_root/collection.log" >&2
            printf 'Evidence collection incomplete (exit %s); retaining archives and diagnostics.\n' "$status" >&2
          fi
          exit "$status"
      - name: Retain failed validation evidence
        if: failure() && steps.validation-archive.outputs.path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.os }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ steps.validation-archive.outputs.path }}
