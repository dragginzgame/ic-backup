name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Retain temporary validation fixtures
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/ci-fixtures"
          echo "TMPDIR=$GITHUB_WORKSPACE/target/ci-fixtures" >> "$GITHUB_ENV"
      - name: Install the pinned development toolchain
        run: rustup show active-toolchain
      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Install the reviewed manifest formatter
        run: |
          source ci/tool-versions.env
          cargo install cargo-sort --version "$SHARED_TOOLING_CARGO_SORT_VERSION" --locked
      - name: Install Linux shell tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Install macOS shell tooling
        if: runner.os == 'macOS'
        run: |
          brew install flock make shellcheck
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Prepare reviewed local host and IC executables
        run: |
          make install-tools
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
      - name: Check tooling with macOS system Bash 3.2
        if: runner.os == 'macOS'
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          /bin/bash scripts/ci/test-tooling.sh
          perl scripts/ci/test-documentation-links.pl
          perl scripts/ci/test-local-lock-versions.pl
          /bin/bash scripts/ci/test-file-digests.sh
          /bin/bash scripts/ci/test-dependency-pins.sh
          /bin/bash scripts/ci/test-cargo-metadata.sh
          /bin/bash scripts/ci/test-format-tools.sh
          /bin/bash scripts/ci/test-evidence-checksums.sh
          /bin/bash scripts/ci/test-evidence-archive.sh
          /bin/bash scripts/ci/test-host-tools.sh
          /bin/bash scripts/ci/test-tool-commands.sh
          /bin/bash scripts/ci/test-cloc.sh
          /bin/bash scripts/ci/test-cloc-tooling.sh
          /bin/bash scripts/ci/test-rust-tools.sh
          /bin/bash scripts/ci/test-ic-tools.sh
          /bin/bash scripts/release/test-release.sh
          RELEASE_MAKE=make /bin/bash scripts/ci/test-release-runner.sh
          /bin/bash scripts/hooks/test-hooks.sh
      - name: Validate the native library and repository tooling
        run: make ci
      - name: Archive failed validation evidence
        id: validation-archive
        if: failure()
        run: |
          inputs=()
          for path in target/ci-fixtures target/validation-failures target/*-tests.*; do
            if [[ -e "$path" || -L "$path" ]]; then
              inputs+=("$GITHUB_WORKSPACE" "$path")
            fi
          done
          if [[ ${#inputs[@]} != 0 ]]; then
            archive="$(mktemp -d "$RUNNER_TEMP/ic-backup-evidence.XXXXXX")/evidence.tar.gz"
            bash scripts/ci/archive-evidence.sh "$archive" "${inputs[@]}"
            printf 'path=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          fi
      - name: Retain failed validation evidence
        if: failure() && steps.validation-archive.outputs.path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.os }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ steps.validation-archive.outputs.path }}
