[workspace]
resolver = "3"
members = ["consumer", "ic-backup-qualification"]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "../LICENSE.md"
publish = false

[workspace.dependencies]
ic-backup = { path = "../crates/ic-backup", version = "0.104.0" }
ic-backup-consumer = { path = "consumer" }
ic-host-process = "0.80.2"
ic-platform = { version = "0.34.9", default-features = false, features = ["ed25519", "ingress-packets"] }
# The current product source-read API still exposes this cohort's management DTOs.
ic-platform-legacy = { package = "ic-platform", version = "0.33.7", default-features = false, features = ["management-canister-types", "principal-self-authenticating"] }
ic-testkit = { version = "0.107.4", default-features = false, features = ["managed-server"] }
tokio = { version = "1.53.3", default-features = false, features = ["rt", "net", "time"] }

toko-tooling = "=0.44.11"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"

[profile.dev]
debug = 0
